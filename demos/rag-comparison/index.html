  fly.style.left = lerp(sx, ex, u).toFixed(1) + 'px'; fly.style.top = lerp(sy, ey, u).toFixed(1) + 'px';
  fly.style.transform = `translateY(-50%) scale(${lerp(1, 0.82, u).toFixed(3)})`;
  fly.style.opacity = (1 - P(tl, t1 - 0.12, t1 + 0.05)).toFixed(3);
  return true;
}

const vp = VectorPanel($('svgV')), gp = GraphPanel($('svgG'));
let sIdx = 0, t = 0, playing = true, last = null, ansV = null, ansG = null, curS = -1;
const qtext = $('qtext'), qtag = $('qtag'), banner = $('banner');
function enterScenario() {
  const sc = SCN[sIdx];
  ansV = fillAnswer($('ansV'), sc.v); ansG = fillAnswer($('ansG'), sc.g);
  qtag.textContent = sc.tag;
  banner.textContent = sc.banner; banner.className = 'banner ' + sc.win;
  ['tab0', 'tab1'].forEach((id, i) => $(id).setAttribute('aria-selected', i === sIdx ? 'true' : 'false'));
  curS = sIdx;
}
function render() {
  if (curS !== sIdx) enterScenario();
  const sc = SCN[sIdx];
  const n = Math.floor(sc.q.length * P(t, T.type[0], T.type[1]));
  const qkey = sIdx + ':' + n;
  if (qtext.dataset.k !== qkey) {
    qtext.dataset.k = qkey; qtext.textContent = sc.q.slice(0, n);
    if (n < sc.q.length) { const c = document.createElement('span'); c.className = 'caret'; qtext.append(c); }
  }
  const tv = t, tg = t - T.G0; // each panel runs on its own clock: Vector RAG first, then GraphRAG
  setSteps(stepV, STEPS_V, tv, T.v.done); setSteps(stepG, STEPS_G, tg, T.g.done);
  $('capV').textContent = capAt(CAP_V, tv); $('capG').textContent = capAt(CAP_G, Math.max(0, tg));
  setStat($('statV'), capAt(STAT_V, tv)); setStat($('statG'), capAt(STAT_G, tg));
  vp.update(tv, sc); gp.update(tg, sc);
  const verdictOn = t >= T.verdict;
  showAnswer(ansV, tv, T.v.ans[0], T.v.ans[1], T.v.done, verdictOn);
  showAnswer(ansG, tg, T.g.ans[0], T.g.ans[1], T.g.done, verdictOn);
  const gStart = T.G0 + T.chunk[0] - 0.6;
  panelV.classList.toggle('dim', t >= gStart && !verdictOn);
  panelG.classList.toggle('dim', t >= T.chunk[0] - 0.4 && t < gStart);
  const flying = flyQuestion(sc, vp, tv, T.v.prompt[0] + 0.5, T.v.prompt[0] + 1.7) || flyQuestion(sc, gp, tg, T.g.map[0] + 0.25, T.g.map[0] + 1.35);
  fly.style.display = flying ? 'block' : 'none';
  qSec.classList.toggle('send', flying);
  banner.classList.toggle('on', t >= T.verdict + 0.8);
  $('progFill').style.width = (100 * t / T.end).toFixed(2) + '%';
}
function setPlaying(p) {
  playing = p;
  $('btnPlay').setAttribute('aria-label', p ? '일시정지' : '재생');
  $('icoPlay').innerHTML = p ? '<rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/>' : '<path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L5.2 1.5A.8.8 0 0 0 4 2.2z"/>';
}
function frame(now) {
  if (last == null) last = now;
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (playing) { t += dt; if (t >= T.end) { sIdx = (sIdx + 1) % SCN.length; t = 0; } }
  render();
  requestAnimationFrame(frame);
}
$('btnPlay').addEventListener('click', () => setPlaying(!playing));
$('btnRestart').addEventListener('click', () => { t = 0; setPlaying(true); });
$('tab0').addEventListener('click', () => { sIdx = 0; t = 0; setPlaying(true); });
$('tab1').addEventListener('click', () => { sIdx = 1; t = 0; setPlaying(true); });
$('prog').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * T.end; });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !document.activeElement.closest('button,input,textarea,select,a,summary,[contenteditable]')) { e.preventDefault(); setPlaying(!playing); } });
window.__demo = { seek(s, tt) { sIdx = s; t = tt; render(); }, pause() { setPlaying(false); }, T };
if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { t = T.end - 0.5; setPlaying(false); }
render();
requestAnimationFrame(frame);
})();

</script>
